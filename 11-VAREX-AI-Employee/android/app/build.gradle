plugins {
    id "com.android.application"
}

android {
    namespace "com.varex.ai"
    compileSdk 36

    defaultConfig {
        applicationId "com.varex.ai"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
        buildConfigField "String", "API_BASE_URL", '"https://varex-ai-employee.areejalloush1988.chatgpt.site/api"'
        buildConfigField "String", "DASHBOARD_URL", '"https://varex-ai-employee.areejalloush1988.chatgpt.site"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
