<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#312e81"><title>VAREX | تعيين كلمة مرور</title><link rel="icon" href="./varex-pharmacy-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"></head>
<body class="auth-body" data-auth-page="reset"><main class="auth-shell">
<section class="auth-brand"><div><img class="auth-logo" src="./varex-pharmacy-logo.svg" alt="VAREX"><div class="auth-copy"><h1>أنشئ كلمة مرور جديدة</h1><p>اختر كلمة مرور قوية لا تقل عن ثمانية أحرف للحفاظ على أمان حساب الصيدلية.</p><div class="auth-pills"><span>8 أحرف على الأقل</span><span>حماية أفضل</span></div></div></div><div class="auth-brand-foot">VAREX PHARMACY MANAGEMENT • NEW PASSWORD</div></section>
<section class="auth-panel"><div class="secure-line"><i></i><span>تحديث محمي</span></div><div class="auth-heading"><h2>إعادة تعيين كلمة المرور</h2><p>أدخل كلمة المرور الجديدة ثم أكدها.</p></div>
<form id="resetForm" novalidate><div class="field"><label for="newPassword">كلمة المرور الجديدة</label><div class="input-wrap"><span class="field-icon">🔒</span><input class="input" id="newPassword" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل" required><button class="eye-btn" type="button" data-toggle-password="newPassword">👁</button></div></div><div class="field"><label for="newPasswordConfirm">تأكيد كلمة المرور</label><div class="input-wrap"><span class="field-icon">🔒</span><input class="input" id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="أعد إدخال كلمة المرور" required></div></div><button class="primary-btn full-btn" id="resetBtn" type="submit">حفظ كلمة المرور الجديدة</button><div class="form-message" id="message" role="alert"></div></form>
<div class="auth-footer"><a class="text-link" href="./login.html">العودة إلى تسجيل الدخول</a></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth.js"></script></body></html>
