<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#312e81"><title>VAREX | نظام إدارة الصيدليات</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./varex-pharmacy-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
</head><body>
<div id="appScale"><div class="app-shell">
  <header class="topbar">
    <div class="top-brand"><img class="top-logo" src="./varex-pharmacy-logo.svg" alt="VAREX"><div class="brand-name"><strong>VAREX</strong><span>نظام إدارة الصيدليات</span></div></div>
    <div class="top-title"><h1 id="headerPharmacyName">صيدلية VAREX</h1><p>BUSINESS MANAGEMENT SYSTEM • PHARMACY</p></div>
    <div class="top-actions">
      <div class="status-pill"><i></i><span>النظام متصل وجاهز للعمل</span></div>
      <button class="tool-btn" id="clockButton" type="button" title="الوقت والتاريخ"><span>🕘</span><span class="tool-label" id="liveClock">--:--</span></button>
      <button class="tool-btn" id="zoomOut" type="button" title="تصغير الشاشة">−</button>
      <select class="zoom-select" id="zoomSelect" aria-label="حجم الشاشة"><option value="100">100%</option><option value="90">90%</option><option value="80">80%</option><option value="70">70%</option><option value="60">60%</option><option value="50">50%</option></select>
      <button class="tool-btn" id="zoomIn" type="button" title="تكبير الشاشة">＋</button>
      <button class="tool-btn active" id="soundToggle" type="button" title="صوت النقر"><span id="soundIcon">🔊</span><span class="tool-label" id="soundLabel">الصوت</span></button>
      <button class="tool-btn" id="fullscreenButton" type="button" title="ملء الشاشة"><span>⛶</span><span class="tool-label">ملء الشاشة</span></button>
    </div>
  </header>
  <div class="workspace">
    <aside class="dock"><nav id="mainNav">
      <button class="dock-btn active" data-page="dashboard"><span class="nav-icon">⌂</span><span class="nav-label">الرئيسية</span></button>
      <button class="dock-btn" data-page="pos"><span class="nav-icon">🧾</span><span class="nav-label">المبيعات</span></button>
      <button class="dock-btn" data-page="medicines"><span class="nav-icon">💊</span><span class="nav-label">الأدوية</span></button>
      <button class="dock-btn" data-page="batches"><span class="nav-icon">🧪</span><span class="nav-label">التشغيلات</span></button>
      <button class="dock-btn" data-page="purchases"><span class="nav-icon">📦</span><span class="nav-label">المشتريات</span></button>
      <button class="dock-btn" data-page="suppliers"><span class="nav-icon">🚚</span><span class="nav-label">الموردون</span></button>
      <button class="dock-btn" data-page="customers"><span class="nav-icon">👥</span><span class="nav-label">العملاء</span></button>
      <button class="dock-btn" data-page="prescriptions"><span class="nav-icon">🩺</span><span class="nav-label">الوصفات</span></button>
      <button class="dock-btn" data-page="expenses"><span class="nav-icon">💳</span><span class="nav-label">المصروفات</span></button>
      <button class="dock-btn" data-page="employees"><span class="nav-icon">👨‍⚕️</span><span class="nav-label">الموظفون</span></button>
      <button class="dock-btn" data-page="reports"><span class="nav-icon">📊</span><span class="nav-label">التقارير</span></button>
      <button class="dock-btn" data-page="settings"><span class="nav-icon">⚙️</span><span class="nav-label">الإعدادات</span></button>
      <div class="dock-sep"></div>
      <button class="dock-btn logout" id="logoutButton" type="button"><span class="nav-icon">⏻</span><span class="nav-label">تسجيل الخروج</span></button>
    </nav></aside>
    <main class="main-content" id="pageHost" aria-live="polite"></main>
  </div>
</div></div>

<div class="modal-layer" id="modalLayer" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true"><div class="modal-head"><h3 id="modalTitle">إضافة</h3><button class="modal-close" id="modalClose" type="button">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
<div class="toast-stack" id="toastStack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth.js"></script><script src="./app.js"></script>
</body></html>
