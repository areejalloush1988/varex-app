<!doctype html>
<html lang="ar" dir="rtl">
  <body style="margin:0;background:#f1f5f9;font-family:Arial,Tahoma,sans-serif;color:#172554">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 14px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden">
            <tr><td style="padding:24px 28px;background:#172554;color:#ffffff;font-size:24px;font-weight:800;letter-spacing:4px;text-align:center" dir="ltr">VAREX</td></tr>
            <tr>
              <td style="padding:30px 28px;text-align:center">
                <h1 style="margin:0 0 12px;font-size:22px">رمز التحقق الآمن</h1>
                <p style="margin:0 0 24px;color:#64748b;font-size:14px;line-height:1.9">تم طلب رمز للتحقق من حساب المالك قبل حذف حساب المنشأة. يرجى إدخال الرمز التالي داخل تطبيق VAREX:</p>
                <div style="display:inline-block;padding:15px 24px;border:1px solid #bfdbfe;border-radius:12px;background:#eff6ff;color:#172554;font-family:Arial,sans-serif;font-size:32px;font-weight:900;letter-spacing:9px" dir="ltr">{{ .Token }}</div>
                <p style="margin:22px 0 0;color:#64748b;font-size:12px;line-height:1.8">تنتهي صلاحية الرمز خلال 10 دقائق. إذا لم يتم طلب حذف الحساب، يرجى تجاهل هذه الرسالة وعدم مشاركة الرمز.</p>
              </td>
            </tr>
            <tr><td style="padding:15px 20px;background:#f8fafc;color:#94a3b8;font-size:10px;text-align:center">VAREX BUSINESS MANAGEMENT SYSTEM</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
