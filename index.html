<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VAREX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 50px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #172554;
      margin-bottom: 15px;
    }

    h1 {
      color: #172554;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 18px;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 20px;
      background: #dcfce7;
      color: #166534;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="welcome">

    <div class="logo">VAREX</div>

    <h1>منصة إدارة الأعمال</h1>

    <p>
      نظام متكامل لإدارة المبيعات والمخزون والحسابات
      والموظفين والتقارير.
    </p>

    <div class="status">
      ✓ تم تشغيل مشروع VAREX بنجاح
    </div>

  </div>

</body>
</html>
