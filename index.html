<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VAREX</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#172554">
  <link rel="icon" type="image/png" sizes="192x192" href="./varex-icon-192.png">
</head>
<body>
  <p><a id="applicationEntry" href="./systems.html">فتح أنظمة VAREX</a></p>
  <script>
    const isTradingDomain = location.hostname === "app.varexapp.com";
    const destination = isTradingDomain
      ? "/trading/" + location.search + location.hash
      : "./systems.html";
    if (isTradingDomain) {
      const entry = document.getElementById("applicationEntry");
      entry.href = destination;
      entry.textContent = "فتح VAREX مساعد التحليل";
    }
    location.replace(destination);
  </script>
</body>
</html>
