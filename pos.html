<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAREX | نقطة البيع</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172554;
    }

    header {
      background: #172554;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .container {
      width: 94%;
      max-width: 1200px;
      margin: 30px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    .pos {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      background: #fff;
    }

    .product:hover {
      background: #f8fafc;
    }

    .product strong {
      display: block;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-weight: bold;
    }

    .cart-title {
      margin-bottom: 18px;
    }

    .empty-cart {
      text-align: center;
      padding: 35px 10px;
      color: #94a3b8;
      border-bottom: 1px solid #e2e8f0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: bold;
      margin: 22px 0;
    }

    .pay {
      width: 100%;
      border: 0;
      background: #172554;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    @media (max-width: 750px) {
      .pos {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">VAREX</div>
  <a class="back" href="index.html">← العودة إلى لوحة التحكم</a>
</header>

<div class="container">

  <h1>🛒 نقطة البيع</h1>
  <p class="subtitle">إنشاء عملية بيع جديدة وإدارة الفاتورة.</p>

  <div class="pos">

    <div class="panel">
      <input
        class="search"
        type="text"
        placeholder="🔍 ابحث عن منتج أو امسح الباركود"
      >

      <div class="products">
        <div class="product">
          <strong>منتج تجريبي 1</strong>
          <span class="price">25.00 د.إ</span>
        </div>

        <div class="product">
          <strong>منتج تجريبي 2</strong>
          <span class="price">40.00 د.إ</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="cart-title">الفاتورة الحالية</h2>

      <div class="empty-cart">
        لم تتم إضافة أي منتجات بعد
      </div>

      <div class="total">
        <span>الإجمالي</span>
        <span>0.00 د.إ</span>
      </div>

      <button class="pay">إتمام عملية البيع</button>
    </div>

  </div>

</div>

</body>
</html>
