name: Build VAREX Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "*.png"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare VAREX web bundle
        run: node scripts/build-mobile.mjs

      - name: Synchronize Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload VAREX APK
        uses: actions/upload-artifact@v4
        with:
          name: VAREX-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
