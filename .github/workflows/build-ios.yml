name: Build VAREX iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-ios.yml"

concurrency:
  group: varex-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build:web

      - name: Create and sync iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iPhone simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator build
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Debug-iphonesimulator/App.app \
            VAREX-iOS-Simulator.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAREX-iOS-Simulator
          path: VAREX-iOS-Simulator.zip
          retention-days: 14
