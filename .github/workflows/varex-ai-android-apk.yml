name: Build VAREX AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "11-VAREX-AI-Employee/android/**"
      - ".github/workflows/varex-ai-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify and build release
        run: |
          gradle -p 11-VAREX-AI-Employee/android lintRelease assembleRelease --no-daemon
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" 11-VAREX-AI-Employee/android/app/build/outputs/apk/release/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: VAREX-AI-Android
          path: |
            11-VAREX-AI-Employee/android/app/build/outputs/apk/release/app-release-unsigned.apk
            11-VAREX-AI-Employee/android/app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
          retention-days: 30
