name: Build VAREX AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "11-VAREX-AI-Employee/android/**"
      - ".github/workflows/varex-ai-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify and build
        run: gradle -p 11-VAREX-AI-Employee/android lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VAREX-AI-Android
          path: 11-VAREX-AI-Employee/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
