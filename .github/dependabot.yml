version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
    labels:
      - security
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    labels:
      - security
      - dependencies
