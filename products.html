<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAREX - المنتجات والمخزون</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    color:#172554;
}

header{
    background:#172554;
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

.back{
    color:white;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1200px;
    margin:35px auto;
}

.title{
    margin-bottom:25px;
}

.title h1{
    margin:0 0 8px;
}

.title p{
    color:#64748b;
}

.panel{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

input,
select{
    padding:12px;
    border:1px solid #dbe1ea;
    border-radius:9px;
    font-size:14px;
    font-family:inherit;
}

.search{
    flex:1;
    min-width:220px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    cursor:pointer;
    font-family:inherit;
}

.add{
    background:#172554;
    color:white;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th,
td{
    padding:14px 10px;
    text-align:right;
    border-bottom:1px solid #edf0f5;
}

th{
    background:#f8fafc;
}

.stock-ok{
    color:#15803d;
    font-weight:bold;
}

.stock-low{
    color:#dc2626;
    font-weight:bold;
}

.stock-out{
    color:#991b1b;
    font-weight:bold;
}

.action{
    background:#eef2ff;
    color:#172554;
    padding:7px 10px;
    margin:2px;
}

.details-button{
    background:#ecfeff;
    color:#155e75;
    padding:7px 11px;
    margin:2px;
    font-weight:bold;
}

.delete{
    background:#fee2e2;
    color:#b91c1c;
    padding:7px 10px;
    margin:2px;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:30px;
}

/* =========================
   تفاصيل المخزون
   ========================= */

.details-row td{
    padding:0;
    background:#f8fafc;
}

.product-details{
    padding:20px;
    border-right:4px solid #172554;
    background:#f8fafc;
}

.details-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:15px;
    color:#172554;
}

.details-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.detail-card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:11px;
    padding:15px;
}

.detail-card span{
    display:block;
    color:#64748b;
    font-size:13px;
    margin-bottom:8px;
}

.detail-card strong{
    display:block;
    color:#172554;
    font-size:17px;
}

.detail-card.stock strong{
    color:#15803d;
}

.detail-card.sold strong{
    color:#2563eb;
}

.detail-card.last-sale strong{
    font-size:14px;
}

/* =========================
   MODAL
   ========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    background:white;
    width:90%;
    max-width:550px;
    border-radius:16px;
    padding:25px;
    max-height:90vh;
    overflow:auto;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-grid input{
    width:100%;
}

.save{
    background:#172554;
    color:white;
    width:100%;
    margin-top:15px;
}

.close{
    float:left;
    cursor:pointer;
    font-size:24px;
}

@media(max-width:900px){
    .details-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:750px){
    .form-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .details-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">VAREX</div>

    <a class="back" href="index.html">
        ← لوحة التحكم
    </a>
</header>

<div class="container">

    <div class="title">
        <h1>📦 المنتجات والمخزون</h1>

        <p>
            إدارة المنتجات والأسعار والكميات وحركة المخزون
        </p>
    </div>

    <div class="panel">

        <div class="toolbar">

            <input
                class="search"
                id="search"
                type="text"
                placeholder="🔍 ابحث باسم المنتج أو الباركود"
                oninput="renderProducts()"
            >

            <select
                id="categoryFilter"
                onchange="renderProducts()"
            >
                <option value="">
                    كل التصنيفات
                </option>
            </select>

            <button
                class="add"
                onclick="openModal()"
            >
                + إضافة منتج
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>الباركود</th>
                        <th>التصنيف</th>
                        <th>سعر البيع</th>
                        <th>التكلفة</th>
                        <th>الكمية الحالية</th>
                        <th>حد التنبيه</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>

                <tbody id="productTable"></tbody>

            </table>

            <div
                class="empty"
                id="emptyMessage"
            >
                لا توجد منتجات حتى الآن.
            </div>

        </div>
    </div>
</div>

<!-- =========================
     نافذة إضافة / تعديل المنتج
     ========================= -->

<div
    class="modal"
    id="productModal"
>
    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>

        <h2 id="modalTitle">
            إضافة منتج جديد
        </h2>

        <div class="form-grid">

            <input
                id="name"
                placeholder="اسم المنتج"
            >

            <input
                id="barcode"
                placeholder="الباركود"
            >

            <input
                id="category"
                placeholder="التصنيف"
            >

            <input
                id="price"
                type="number"
                min="0"
                step="0.01"
                placeholder="سعر البيع"
            >

            <input
                id="cost"
                type="number"
                min="0"
                step="0.01"
                placeholder="سعر التكلفة"
            >

            <input
                id="quantity"
                type="number"
                min="0"
                step="1"
                placeholder="الكمية الموجودة في المخزن"
            >

            <input
                id="minimumStock"
                type="number"
                min="0"
                step="1"
                value="5"
                placeholder="حد تنبيه المخزون"
            >

            <input
                id="supplier"
                placeholder="المورد"
            >

        </div>

        <button
            class="save"
            onclick="saveProduct()"
        >
            حفظ المنتج
        </button>

    </div>
</div>

<script src="varex.js"></script>

<script>

let editingProductId = null;
let openedDetailsId = null;


/* =========================
   فتح نافذة إضافة منتج
   ========================= */

function openModal(){

    editingProductId = null;

    document.getElementById(
        "modalTitle"
    ).innerText =
        "إضافة منتج جديد";

    clearForm();

    document.getElementById(
        "minimumStock"
    ).value = 5;

    document.getElementById(
        "productModal"
    ).style.display =
        "flex";
}


/* =========================
   إغلاق النافذة
   ========================= */

function closeModal(){

    document.getElementById(
        "productModal"
    ).style.display =
        "none";

    editingProductId = null;
}


/* =========================
   تنظيف النموذج
   ========================= */

function clearForm(){

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "barcode"
    ).value = "";

    document.getElementById(
        "category"
    ).value = "";

    document.getElementById(
        "price"
    ).value = "";

    document.getElementById(
        "cost"
    ).value = "";

    document.getElementById(
        "quantity"
    ).value = "";

    document.getElementById(
        "minimumStock"
    ).value = "";

    document.getElementById(
        "supplier"
    ).value = "";
}


/* =========================
   حفظ المنتج
   ========================= */

function saveProduct(){

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const barcode =
        document.getElementById(
            "barcode"
        ).value.trim();

    const category =
        document.getElementById(
            "category"
        ).value.trim() ||
        "عام";

    const price =
        Number(
            document.getElementById(
                "price"
            ).value || 0
        );

    const cost =
        Number(
            document.getElementById(
                "cost"
            ).value || 0
        );

    const quantity =
        Number(
            document.getElementById(
                "quantity"
            ).value || 0
        );

    const minimumStock =
        Number(
            document.getElementById(
                "minimumStock"
            ).value || 0
        );

    const supplier =
        document.getElementById(
            "supplier"
        ).value.trim();

    if(!name){

        alert(
            "يرجى إدخال اسم المنتج"
        );

        return;
    }

    if(quantity < 0){

        alert(
            "الكمية لا يمكن أن تكون أقل من صفر"
        );

        return;
    }

    if(editingProductId){

        VAREX.updateProduct(
            editingProductId,
            {
                name,
                barcode,
                category,
                price,
                cost,
                quantity,
                minimumStock,
                supplier
            }
        );

    }else{

        VAREX.addProduct({
            name,
            barcode,
            category,
            price,
            cost,
            quantity,
            minimumStock,
            supplier
        });
    }

    closeModal();

    updateCategoryFilter();

    renderProducts();
}


/* =========================
   تعديل المنتج
   ========================= */

function editProduct(id){

    const product =
        VAREX.findProduct(id);

    if(!product){

        alert(
            "لم يتم العثور على المنتج"
        );

        return;
    }

    editingProductId = id;

    document.getElementById(
        "modalTitle"
    ).innerText =
        "تعديل المنتج";

    document.getElementById(
        "name"
    ).value =
        product.name || "";

    document.getElementById(
        "barcode"
    ).value =
        product.barcode || "";

    document.getElementById(
        "category"
    ).value =
        product.category || "";

    document.getElementById(
        "price"
    ).value =
        Number(
            product.price || 0
        );

    document.getElementById(
        "cost"
    ).value =
        Number(
            product.cost || 0
        );

    document.getElementById(
        "quantity"
    ).value =
        Number(
            product.quantity || 0
        );

    document.getElementById(
        "minimumStock"
    ).value =
        Number(
            product.minimumStock || 0
        );

    document.getElementById(
        "supplier"
    ).value =
        product.supplier || "";

    document.getElementById(
        "productModal"
    ).style.display =
        "flex";
}


/* =========================
   حذف المنتج
   ========================= */

function deleteProduct(id){

    const product =
        VAREX.findProduct(id);

    if(!product){
        return;
    }

    const confirmed =
        confirm(
            'هل تريد حذف المنتج "' +
            product.name +
            '"؟'
        );

    if(!confirmed){
        return;
    }

    const products =
        VAREX
            .getProducts()
            .filter(
                item =>
                    String(item.id) !==
                    String(id)
            );

    VAREX.saveProducts(
        products
    );

    if(
        String(openedDetailsId) ===
        String(id)
    ){
        openedDetailsId = null;
    }

    updateCategoryFilter();

    renderProducts();
}


/* =========================
   تحديث التصنيفات
   ========================= */

function updateCategoryFilter(){

    const select =
        document.getElementById(
            "categoryFilter"
        );

    const currentValue =
        select.value;

    const products =
        VAREX.getProducts();

    const categories = [
        ...new Set(
            products
                .map(
                    product =>
                        (
                            product.category ||
                            ""
                        ).trim()
                )
                .filter(Boolean)
        )
    ].sort();

    select.innerHTML =
        '<option value="">كل التصنيفات</option>';

    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );
        }
    );

    if(
        categories.includes(
            currentValue
        )
    ){
        select.value =
            currentValue;
    }
}


/* =========================
   فتح / إغلاق تفاصيل المنتج
   ========================= */

function toggleProductDetails(id){

    if(
        String(openedDetailsId) ===
        String(id)
    ){
        openedDetailsId = null;
    }else{
        openedDetailsId = id;
    }

    renderProducts();
}


/* =========================
   معلومات مبيعات المنتج
   ========================= */

function getProductSalesInfo(productId){

    const sales =
        typeof VAREX.getSales ===
        "function"
            ? VAREX.getSales()
            : [];

    const today =
        VAREX.today();

    let soldToday = 0;

    let lastSaleDate = null;

    sales.forEach(sale => {

        if(!sale){
            return;
        }

        const saleDate =
            sale.date
                ? new Date(
                    sale.date
                )
                : null;

        const saleDay =
            saleDate &&
            !Number.isNaN(
                saleDate.getTime()
            )
                ? getLocalDateString(
                    saleDate
                )
                : "";

        const items =
            Array.isArray(
                sale.items
            )
                ? sale.items
                : [];

        items.forEach(item => {

            if(
                String(
                    item.productId
                ) !==
                String(
                    productId
                )
            ){
                return;
            }

            if(
                saleDay === today
            ){
                soldToday +=
                    Number(
                        item.quantity ||
                        0
                    );
            }

            if(
                saleDate &&
                !Number.isNaN(
                    saleDate.getTime()
                )
            ){
                if(
                    !lastSaleDate ||
                    saleDate >
                    lastSaleDate
                ){
                    lastSaleDate =
                        saleDate;
                }
            }
        });
    });

    return {
        soldToday,
        lastSaleDate
    };
}


/* =========================
   تحويل التاريخ إلى YYYY-MM-DD
   حسب التاريخ المحلي
   ========================= */

function getLocalDateString(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =========================
   تنسيق آخر عملية بيع
   ========================= */

function formatLastSale(date){

    if(!date){
        return "لا توجد مبيعات";
    }

    return date.toLocaleString(
        "ar-AE",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================
   إنشاء ستارة التفاصيل
   ========================= */

function createDetailsRow(
    product
){

    const salesInfo =
        getProductSalesInfo(
            product.id
        );

    const quantity =
        Number(
            product.quantity || 0
        );

    const cost =
        Number(
            product.cost || 0
        );

    const price =
        Number(
            product.price || 0
        );

    const detailsRow =
        document.createElement(
            "tr"
        );

    detailsRow.className =
        "details-row";

    const detailsCell =
        document.createElement(
            "td"
        );

    detailsCell.colSpan = 9;

    detailsCell.innerHTML = `
        <div class="product-details">

            <div class="details-title">
                📦 تفاصيل المخزون —
                ${escapeHTML(product.name)}
            </div>

            <div class="details-grid">

                <div class="detail-card stock">
                    <span>
                        الكمية الحالية في المخزون
                    </span>
                    <strong>
                        ${quantity}
                    </strong>
                </div>

                <div class="detail-card sold">
                    <span>
                        المباع اليوم
                    </span>
                    <strong>
                        ${salesInfo.soldToday}
                    </strong>
                </div>

                <div class="detail-card">
                    <span>
                        سعر التكلفة للوحدة
                    </span>
                    <strong>
                        ${VAREX.money(cost)}
                    </strong>
                </div>

                <div class="detail-card">
                    <span>
                        سعر البيع للوحدة
                    </span>
                    <strong>
                        ${VAREX.money(price)}
                    </strong>
                </div>

                <div class="detail-card last-sale">
                    <span>
                        آخر عملية بيع
                    </span>
                    <strong>
                        ${escapeHTML(
                            formatLastSale(
                                salesInfo.lastSaleDate
                            )
                        )}
                    </strong>
                </div>

            </div>

        </div>
    `;

    detailsRow.appendChild(
        detailsCell
    );

    return detailsRow;
}


/* =========================
   عرض المنتجات
   ========================= */

function renderProducts(){

    const products =
        VAREX.getProducts();

    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .trim()
            .toLowerCase();

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        ).value;

    const table =
        document.getElementById(
            "productTable"
        );

    const emptyMessage =
        document.getElementById(
            "emptyMessage"
        );

    table.innerHTML = "";

    const filteredProducts =
        products.filter(
            product => {

                const searchable =
                    (
                        (
                            product.name ||
                            ""
                        ) +
                        " " +
                        (
                            product.barcode ||
                            ""
                        )
                    ).toLowerCase();

                const matchesSearch =
                    searchable.includes(
                        search
                    );

                const matchesCategory =
                    !categoryFilter ||
                    product.category ===
                    categoryFilter;

                return (
                    matchesSearch &&
                    matchesCategory
                );
            }
        );

    filteredProducts.forEach(
        product => {

            const quantity =
                Number(
                    product.quantity ||
                    0
                );

            const minimum =
                Number(
                    product.minimumStock ||
                    0
                );

            let status =
                "متوفر";

            let statusClass =
                "stock-ok";

            if(quantity <= 0){

                status =
                    "نفد المخزون";

                statusClass =
                    "stock-out";

            }else if(
                quantity <= minimum
            ){

                status =
                    "منخفض";

                statusClass =
                    "stock-low";
            }

            const row =
                document.createElement(
                    "tr"
                );

            const detailsOpened =
                String(
                    openedDetailsId
                ) ===
                String(
                    product.id
                );

            row.innerHTML = `

                <td>
                    ${escapeHTML(
                        product.name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        product.barcode ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        product.category ||
                        "عام"
                    )}
                </td>

                <td>
                    ${VAREX.money(
                        product.price
                    )}
                </td>

                <td>
                    ${VAREX.money(
                        product.cost
                    )}
                </td>

                <td>
                    ${quantity}
                </td>

                <td>
                    ${minimum}
                </td>

                <td
                    class="${statusClass}"
                >
                    ${status}
                </td>

                <td>

                    <button
                        class="details-button"
                        onclick="toggleProductDetails('${product.id}')"
                        title="تفاصيل المخزون"
                    >
                        ${
                            detailsOpened
                                ? "ⓘ إغلاق"
                                : "ⓘ التفاصيل"
                        }
                    </button>

                    <button
                        class="action"
                        onclick="editProduct('${product.id}')"
                    >
                        تعديل
                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct('${product.id}')"
                    >
                        حذف
                    </button>

                </td>
            `;

            table.appendChild(
                row
            );

            if(detailsOpened){

                table.appendChild(
                    createDetailsRow(
                        product
                    )
                );
            }
        }
    );

    emptyMessage.style.display =
        filteredProducts.length
            ? "none"
            : "block";
}


/* =========================
   حماية النصوص
   ========================= */

function escapeHTML(value){

    const element =
        document.createElement(
            "div"
        );

    element.textContent =
        value == null
            ? ""
            : String(value);

    return element.innerHTML;
}


/* =========================
   إغلاق النافذة من الخارج
   ========================= */

document
    .getElementById(
        "productModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){
                closeModal();
            }
        }
    );


/* =========================
   تشغيل الصفحة
   ========================= */

updateCategoryFilter();

renderProducts();

</script>

</body>
</html>
